<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satvaya Essence — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;700&family=Great+Vibes&family=Parisienne&family=Syne:wght@500;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ece7dd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1180px;
      min-height: 760px;
      background: linear-gradient(135deg, #15122b 0%, #21193f 100%);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.18);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 72px 72px;
    }

    .shape-left,
    .shape-right {
      position: absolute;
      top: 0;
      width: 220px;
      height: 100%;
      background: #8b5cf6;
      opacity: 0.95;
      z-index: 1;
    }

    .shape-left {
      left: -140px;
      transform: skewX(-20deg);
    }

    .shape-right {
      right: -140px;
      transform: skewX(-20deg);
    }

    .content {
      position: relative;
      z-index: 5;
      min-height: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 30px;
    }

    .brand {
      position: absolute;
      top: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      color: #f4f1ff;
    }

    

    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .brand-text small {
      font-size: 0.68rem;
      letter-spacing: 0.42em;
      color: #d6cfff;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .brand-text h3 {
      font-family: 'Parisienne', cursive;
      font-size: 2.9rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(255,255,255,0.12);
    }

    .countdown {
      display: flex;
      gap: 14px;
      margin-bottom: 42px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .time-box {
      width: 88px;
      height: 88px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time-box h2 {
      font-family: 'Syne', sans-serif;
      color: #f8b4ff;
      font-size: 1.9rem;
      font-weight: 800;
    }

    .time-box span {
      margin-top: 4px;
      font-size: 0.62rem;
      color: #869188;
      letter-spacing: 0.16em;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      color: white;
      font-size: clamp(3rem, 6vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      font-weight: 800;
      max-width: 900px;
    }

    h1 span {
      display: block;
      color: #ffb8e6;
      margin-top: 12px;
    }

    .description {
      margin-top: 26px;
      max-width: 620px;
      color: #c2bdd8;
      font-size: 1rem;
      line-height: 1.9;
      font-weight: 300;
    }

    .balloon {
      position: absolute;
      z-index: 2;
      width: 92px;
      height: 112px;
      border-radius: 50% 50% 46% 46%;
      box-shadow:
        inset -10px -14px 20px rgba(0,0,0,0.08),
        0 18px 32px rgba(0,0,0,0.18);
      animation: float 7s ease-in-out infinite;
    }

    .balloon::before {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: rgba(255,255,255,0.42);
      border-radius: 50%;
      top: 18px;
      left: 18px;
      filter: blur(2px);
    }

    .balloon::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 72px;
      background: rgba(255,255,255,0.28);
      bottom: -70px;
      left: 50%;
      transform: translateX(-50%);
    }

    .m1 {
      top: 14%;
      left: 10%;
      transform: rotate(-10deg);
      background: linear-gradient(180deg, #ff8da1 0%, #ff5d7d 100%);
    }

    .m2 {
      top: 10%;
      left: 17%;
      width: 72px;
      height: 90px;
      transform: rotate(10deg);
      animation-delay: 1.5s;
      background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 100%);
    }

    .m3 {
      top: 18%;
      right: 11%;
      width: 82px;
      height: 102px;
      transform: rotate(10deg);
      animation-delay: 2s;
      background: linear-gradient(180deg, #ffcf5a 0%, #ff9f1a 100%);
    }

    .m4 {
      top: 14%;
      right: 18%;
      width: 76px;
      height: 94px;
      transform: rotate(-12deg);
      animation-delay: 1s;
      background: linear-gradient(180deg, #c4b5fd 0%, #8b5cf6 100%);
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0px) rotate(var(--rotate, 0deg));
      }

      50% {
        transform: translateY(-18px) rotate(var(--rotate, 0deg));
      }
    }

      @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        min-height: auto;
      }

      .content {
        min-height: auto;
        padding: 100px 20px 90px;
      }

      h1 {
        font-size: 3.2rem;
      }

      .description {
        font-size: 0.95rem;
      }

      .m1,.m2,.m3,.m4 {
        opacity: 0.35;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="grid"></div>

    <div class="shape-left"></div>
    <div class="shape-right"></div>

    <div class="balloon m1" style="--rotate:-10deg"></div>
    <div class="balloon m2" style="--rotate:6deg"></div>

    <div class="balloon m3" style="--rotate:10deg"></div>
    <div class="balloon m4" style="--rotate:-6deg"></div>

    <div class="content">
      <div class="brand">
        <div class="brand-text">
          <h3>Satvaya Essence</h3>
        </div>
      </div>

      <div class="countdown">
        <div class="time-box">
          <h2 id="days">10</h2>
          <span>DAYS</span>
        </div>

        <div class="time-box">
          <h2 id="hours">21</h2>
          <span>HOURS</span>
        </div>

        <div class="time-box">
          <h2 id="minutes">25</h2>
          <span>MINUTES</span>
        </div>

        <div class="time-box">
          <h2 id="seconds">16</h2>
          <span>SECONDS</span>
        </div>
      </div>

      <h1>
        THE WAIT
        <span>WILL BE WORTH&nbsp;IT</span>
      </h1>

      <div class="description">
        We’re carefully building Satvaya Essence right now.
        A thoughtful and beautifully crafted experience is on its way.
      </div>
    </div>
  </div>

  <script>
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 10);

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = days;
      document.getElementById('hours').innerText = hours;
      document.getElementById('minutes').innerText = minutes;
      document.getElementById('seconds').innerText = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
